[package]
name = "qwen-code"
group = "org.vibevm.qwen"
kind = "app"
version = "0.27.2"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "Apache-2.0"
description = "Qwen Code 0.27.2, the official standalone upstream build with its own bundled Node.js, as a portable Vibe application putting qwen on PATH"
keywords = ["qwen", "qwen-code", "agent", "coding-agent", "cli", "application"]
homepage = "https://github.com/QwenLM/qwen-code"

[compatibility]
min_vibe_version = "1.0.12"
requires_kinds = []

[application]
id = "qwen-code"
keywords = ["qwen", "qwen-code", "agent", "coding-agent"]


[[installer_options]]
id = "linux-x64"
name = "Qwen Code 0.27.2"
platform = "linux"
platform_name = "Linux (glibc)"
arch = "x86_64"
arch_name = "Intel/AMD 64-bit"

[[installer_options.steps]]
id = "qwen-code"
title = "Download and unpack the standalone Qwen Code 0.27.2 build"
kind = "archive"
format = "tar_gz"
source = "https://github.com/QwenLM/qwen-code/releases/download/v0.27.2/qwen-code-linux-x64.tar.gz"
sha256 = "dc0dae0b4016e2d2cb9c17a2f2802bd6f2c4cfa20901bda0b27561faa5aa1176"
payload_root = "qwen-code"

[[installer_options.launchers]]
id = "qwen"
name = "qwen"
description = "The Qwen Code command line (runs on the Node.js bundled in the payload)"
executable = "bin/qwen"
kind = "command"
default = true

[[installer_options.public_commands]]
name = "qwen"
launcher = "qwen"


