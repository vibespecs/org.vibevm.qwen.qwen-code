[package]
name = "qwen-code"
group = "org.vibevm.qwen"
kind = "app"
version = "0.0.1"
epoch = 1
template = true
format = "normal"
authors = ["Oleg Chirukhin"]
license = "Apache-2.0"
description = "Qwen Code {version}, the official standalone upstream build with its own bundled Node.js, as a portable Vibe application putting qwen on PATH"
keywords = ["qwen", "qwen-code", "agent", "coding-agent", "cli", "application"]
homepage = "https://github.com/QwenLM/qwen-code"

[compatibility]
min_vibe_version = "1.0.12"
requires_kinds = []

[application]
id = "qwen-code"
keywords = ["qwen", "qwen-code", "agent", "coding-agent"]

# `[package].version` above is the template REVISION, not a Qwen Code version,
# and it is deliberately numbered below every version this template produces
# (`0.0.1` < `0.25.1`): rendering a template fetched from a per-package Git
# registry is not wired yet (PROP-075 `#P2-AS-BUILT` (8)), so a client that
# resolves this repository by its tag list must prefer a concretely published
# version over this manifest, which it would otherwise install with its
# `{version}` placeholders unsubstituted. `README.md` says how the two tags
# divide the work.
#
# The version domain: the `vX.Y.Z` releases of the upstream repository that
# publish the five standalone archives, listed one row per version.
#
# `kind = "list"` and not `kind = "json"` over the GitHub releases API,
# deliberately and for one measured reason: `[template.versions].url` must be a
# credential-free HTTPS URL with **no query string** (the manifest validator
# refuses `?`), so the only reachable document is
# `https://api.github.com/repos/QwenLM/qwen-code/releases` with its default
# page size of 30. That repository releases four product lines from one tag
# space (`vX.Y.Z`, `sdk-typescript-v…`, `desktop-v…`, `cua-driver-rs-v…`) plus
# nightlies, and a selector cannot filter: measured on 2026-11-11 the default
# page held 30 releases, of which **9** were usable `vX.Y.Z` versions, covering
# 12 days (1.1 MB of JSON per resolution). A JSON domain would therefore drop
# each version — including a version pinned in a corporate drop — about a week
# after its release. A listed domain keeps every version installable for good;
# the price is one row per upstream release, and no digest is ever transcribed
# by hand because they still come from upstream's own `SHA256SUMS`.
#
# Adding a version: append one row, run `vibe app versions
# org.vibevm.qwen/qwen-code`, and bump `[package].version` (the template
# revision). Rows are kept newest last.
[template.versions]
kind = "list"

[[template.versions.item]]
version = "0.25.1"

[[template.versions.item]]
version = "0.25.2"

[[template.versions.item]]
version = "0.25.3"

[[template.versions.item]]
version = "0.26.0"

[[template.versions.item]]
version = "0.26.1"

[[template.versions.item]]
version = "0.26.2"

[[template.versions.item]]
version = "0.26.3"

[[template.versions.item]]
version = "0.26.4"

[[template.versions.item]]
version = "0.26.5"

[[template.versions.item]]
version = "0.26.6"

[[template.versions.item]]
version = "0.26.7"

[[template.versions.item]]
version = "0.26.8"

[[template.versions.item]]
version = "0.26.9"

[[template.versions.item]]
version = "0.27.0"

[[template.versions.item]]
version = "0.27.1"

[[template.versions.item]]
version = "0.27.2"

# One `SHA256SUMS` per release, in `sha256sum(1)` form, naming every archive of
# that release. It carries no sizes, so no option declares `size` and the step
# panel falls back to the server's `Content-Length`.
[template.digests]
kind = "sha256sums"
url = "https://github.com/QwenLM/qwen-code/releases/download/v{version}/SHA256SUMS"


[[installer_options]]
id = "linux-x64"
name = "Qwen Code {version}"
platform = "linux"
platform_name = "Linux (glibc)"
arch = "x86_64"
arch_name = "Intel/AMD 64-bit"

[[installer_options.steps]]
id = "qwen-code"
title = "Download and unpack the standalone Qwen Code {version} build"
kind = "archive"
format = "tar_gz"
source = "https://github.com/QwenLM/qwen-code/releases/download/v{version}/qwen-code-linux-x64.tar.gz"
sha256 = "{sha256:qwen-code-linux-x64.tar.gz}"
payload_root = "qwen-code"

[[installer_options.launchers]]
id = "qwen"
name = "qwen"
description = "The Qwen Code command line (runs on the Node.js bundled in the payload)"
executable = "bin/qwen"
kind = "command"
default = true

[[installer_options.public_commands]]
name = "qwen"
launcher = "qwen"


